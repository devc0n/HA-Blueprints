blueprint:
  name: "Shelly Universele Kamerverlichting"
  description: >
    Universele blueprint voor Shelly Gen2/Gen3 schakelaars die alle lampen
    in dezelfde ruimte bedienen.
    
    - 1x druk: Toggle — sfeerverlichting op basis van zonstand, of uit
    - 2x druk: Focus — helder wit werklicht (100%)
    - 3x druk: Feest — langzame kleur-fade loop (regenboog)
    - Lang indrukken: Nachtlamp (1%, zeer warm)
    
    Mode is 'restart': elke knopdruk stopt een lopende actie (zoals de
    kleur-loop) en start de nieuwe actie.
    
    Werkt met Shelly 1 Mini Gen3, Shelly Plus 1, Shelly Plus 2PM, etc.
    Zorg dat de Shelly op "Detached" modus staat.
  domain: automation
  author: "Ricardo"
  input:
    shelly_device:
      name: "Shelly apparaat"
      description: "Selecteer het Shelly apparaat voor deze kamer"
      selector:
        device:
          integration: shelly

    shelly_channel:
      name: "Shelly kanaal"
      description: "Input kanaal (meestal 1, bij 2-kanaals apparaten evt. 2)"
      default: 1
      selector:
        number:
          min: 0
          max: 4
          step: 1

    target_area:
      name: "Kamer / Area"
      description: "De ruimte waarvan alle lampen bediend worden"
      selector:
        area: {}

    # --- 1x druk: sfeer op basis van zon ---
    day_brightness:
      name: "Helderheid - Overdag"
      description: "Helderheid wanneer de zon hoog staat (> 10°)"
      default: 100
      selector:
        number:
          min: 30
          max: 100
          step: 5
          unit_of_measurement: "%"

    day_color_temp:
      name: "Kleurtemperatuur - Overdag"
      description: "Kleurtemperatuur overdag"
      default: 3500
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: "K"

    sunset_brightness:
      name: "Helderheid - Zonsondergang"
      description: "Helderheid rond zonsondergang (zon tussen -4° en 10°)"
      default: 70
      selector:
        number:
          min: 10
          max: 100
          step: 5
          unit_of_measurement: "%"

    sunset_color_temp:
      name: "Kleurtemperatuur - Zonsondergang"
      description: "Kleurtemperatuur rond zonsondergang"
      default: 2700
      selector:
        number:
          min: 2000
          max: 4000
          step: 100
          unit_of_measurement: "K"

    evening_brightness:
      name: "Helderheid - Avond"
      description: "Helderheid als het donker is (zon onder -4°)"
      default: 50
      selector:
        number:
          min: 10
          max: 100
          step: 5
          unit_of_measurement: "%"

    evening_color_temp:
      name: "Kleurtemperatuur - Avond"
      description: "Kleurtemperatuur in de avond"
      default: 2200
      selector:
        number:
          min: 2000
          max: 3500
          step: 100
          unit_of_measurement: "K"

    late_night_brightness:
      name: "Helderheid - Laat op de avond"
      description: "Helderheid na het ingestelde 'laat' uur"
      default: 25
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: "%"

    late_night_color_temp:
      name: "Kleurtemperatuur - Laat op de avond"
      description: "Kleurtemperatuur laat op de avond"
      default: 2000
      selector:
        number:
          min: 2000
          max: 3000
          step: 100
          unit_of_measurement: "K"

    late_night_hour:
      name: "Starttijd 'laat op de avond'"
      description: "Vanaf welk uur de late-nacht instellingen actief zijn"
      default: 23
      selector:
        number:
          min: 20
          max: 23
          step: 1

    # --- 2x druk: focus ---
    focus_brightness:
      name: "Helderheid - Focus (2x druk)"
      description: "Helderheid voor focus/werklicht"
      default: 100
      selector:
        number:
          min: 50
          max: 100
          step: 5
          unit_of_measurement: "%"

    focus_color_temp:
      name: "Kleurtemperatuur - Focus (2x druk)"
      description: "Kleurtemperatuur in Kelvin voor focus licht"
      default: 4000
      selector:
        number:
          min: 2500
          max: 6500
          step: 100
          unit_of_measurement: "K"

    # --- Lang indrukken: nachtlamp ---
    night_brightness:
      name: "Helderheid - Nachtlamp"
      description: "Helderheid voor nachtlamp modus"
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: "%"

    night_color_temp:
      name: "Kleurtemperatuur - Nachtlamp"
      description: "Kleurtemperatuur in Kelvin voor nachtlamp"
      default: 2000
      selector:
        number:
          min: 2000
          max: 2500
          step: 100
          unit_of_measurement: "K"

    # --- 3x druk: feestmodus ---
    party_brightness:
      name: "Helderheid - Feestmodus (3x druk)"
      description: "Helderheid tijdens de kleur-fade loop"
      default: 80
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"

    party_transition:
      name: "Feest - Fade snelheid (seconden)"
      description: "Hoe lang elke kleurovergang duurt in seconden"
      default: 4
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: "s"

# restart: elke nieuwe knopdruk stopt de lopende actie (bijv. kleur-loop)
mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: single_push
    id: single
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: double_push
    id: double
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: triple_push
    id: triple
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: long_push
    id: long

action:
  - variables:
      area_id: !input target_area
      sun_el: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
      hour: "{{ now().hour }}"
      late_h: !input late_night_hour
      # Zon-gebaseerde sfeerwaarden
      day_br: !input day_brightness
      day_ct: !input day_color_temp
      sunset_br: !input sunset_brightness
      sunset_ct: !input sunset_color_temp
      eve_br: !input evening_brightness
      eve_ct: !input evening_color_temp
      late_br: !input late_night_brightness
      late_ct: !input late_night_color_temp
      # Bereken sfeer op basis van zonstand en uur
      mood_brightness: >
        {% if hour | int >= late_h | int or hour | int < 6 %}
          {{ late_br }}
        {% elif sun_el > 10 %}
          {{ day_br }}
        {% elif sun_el > -4 %}
          {{ sunset_br }}
        {% else %}
          {{ eve_br }}
        {% endif %}
      mood_color_temp: >
        {% if hour | int >= late_h | int or hour | int < 6 %}
          {{ late_ct }}
        {% elif sun_el > 10 %}
          {{ day_ct }}
        {% elif sun_el > -4 %}
          {{ sunset_ct }}
        {% else %}
          {{ eve_ct }}
        {% endif %}
      # Check of er lampen aan staan in de kamer
      lights_on: >
        {{ area_entities(area_id)
           | select('match', 'light\.')
           | select('is_state', 'on')
           | list
           | count > 0 }}

  - choose:
      # ============================================
      # 1x DRUK — Sfeer toggle (zon-gebaseerd)
      # ============================================
      - conditions:
          - condition: trigger
            id: single
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ lights_on }}"
                sequence:
                  - action: light.turn_off
                    target:
                      area_id: !input target_area
            default:
              - action: light.turn_on
                target:
                  area_id: !input target_area
                data:
                  brightness_pct: "{{ mood_brightness | int }}"
                  color_temp_kelvin: "{{ mood_color_temp | int }}"

      # ============================================
      # 2x DRUK — Focus (helder wit werklicht)
      # ============================================
      - conditions:
          - condition: trigger
            id: double
        sequence:
          - action: light.turn_on
            target:
              area_id: !input target_area
            data:
              brightness_pct: !input focus_brightness
              color_temp_kelvin: !input focus_color_temp

      # ============================================
      # 3x DRUK — Feestmodus (kleur-fade loop)
      # ============================================
      - conditions:
          - condition: trigger
            id: triple
        sequence:
          # Zet lampen aan op startkleur
          - action: light.turn_on
            target:
              area_id: !input target_area
            data:
              brightness_pct: !input party_brightness
              rgb_color: [255, 0, 0]
              transition: 1
          - delay:
              seconds: 2
          # Oneindige loop — wordt gestopt door mode: restart
          # bij de volgende knopdruk
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                # Rood → Geel
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [255, 180, 0]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition
                # Geel → Groen
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [0, 255, 0]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition
                # Groen → Cyaan
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [0, 255, 200]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition
                # Cyaan → Blauw
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [0, 0, 255]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition
                # Blauw → Paars
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [150, 0, 255]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition
                # Paars → Roze
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [255, 0, 150]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition
                # Roze → Rood (loop opnieuw)
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [255, 0, 0]
                    transition: !input party_transition
                - delay:
                    seconds: !input party_transition

      # ============================================
      # LANG INDRUKKEN — Nachtlamp
      # ============================================
      - conditions:
          - condition: trigger
            id: long
        sequence:
          - action: light.turn_on
            target:
              area_id: !input target_area
            data:
              brightness_pct: !input night_brightness
              color_temp_kelvin: !input night_color_temp

