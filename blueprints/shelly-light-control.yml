blueprint:
  name: "Shelly Universele Kamerverlichting"
  description: >
    Universele blueprint voor Shelly Gen2/Gen3 schakelaars die alle lampen
    in dezelfde ruimte bedienen.

    - 1x druk: Toggle — gedimde sfeerverlichting op basis van zonstand, of uit.
      Zolang het licht aan is beweegt het mee met de zon: 's ochtends
      langzaam feller, 's avonds langzaam dimmer.
    - 2x druk: Focus — helder wit werklicht (100%)
    - 3x druk: Feest — langzame kleur-fade loop (regenboog)
    - Lang indrukken: Nachtlamp (1%, zeer warm)

    Mode is 'restart': elke knopdruk stopt een lopende actie (zoals de
    kleur-loop of de zonsondergang-overgang) en start de nieuwe actie.

    Werkt met Shelly 1 Mini Gen3, Shelly Plus 1, Shelly Plus 2PM, etc.
    Zorg dat de Shelly op "Detached" modus staat.
  domain: automation
  author: "Ricardo"
  input:
    shelly_device:
      name: "Shelly apparaat"
      description: "Selecteer het Shelly apparaat voor deze kamer"
      selector:
        device:
          integration: shelly

    shelly_channel:
      name: "Shelly kanaal"
      description: "Input kanaal (meestal 1, bij 2-kanaals apparaten evt. 2)"
      default: 1
      selector:
        number:
          min: 0
          max: 4
          step: 1

    target_area:
      name: "Kamer / Area"
      description: "De ruimte waarvan alle lampen bediend worden"
      selector:
        area: {}

# restart: elke nieuwe knopdruk stopt de lopende actie (bijv. kleur-loop)
mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: single_push
    id: single
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: double_push
    id: double
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: triple_push
    id: triple
  - platform: event
    event_type: shelly.click
    event_data:
      device_id: !input shelly_device
      channel: !input shelly_channel
      click_type: long_push
    id: long

action:
  - variables:
      area_id: !input target_area
      # Sfeerwaarden (1x druk): donker bij zon <= dark_el, dag bij zon >= day_el,
      # daartussen lineair op zonhoogte
      day_br: 40
      day_ct: 3500
      dark_br: 8
      dark_ct: 2000
      day_el: 10
      dark_el: -4
      # Overige modi
      focus_br: 100
      focus_ct: 4000
      night_br: 1
      night_ct: 2000
      party_br: 80
      party_tr: 4
      # Meebewegen met de zon: stapgrootte in seconden
      step_s: 120
      # Bereken sfeer op basis van zonstand
      mood_p: >
        {% set el = state_attr('sun.sun', 'elevation') | float(0) %}
        {{ ([0, (el - dark_el) / (day_el - dark_el), 1] | sort)[1] }}
      mood_brightness: "{{ (dark_br + (day_br - dark_br) * mood_p) | round(0) | int }}"
      mood_color_temp: "{{ (dark_ct + (day_ct - dark_ct) * mood_p) | round(0) | int }}"
      # Check of er lampen aan staan in de kamer
      lights_on: >
        {{ area_entities(area_id)
           | select('match', 'light\.')
           | select('is_state', 'on')
           | list
           | count > 0 }}

  - choose:
      # ============================================
      # 1x DRUK — Sfeer toggle (zon-gebaseerd)
      # ============================================
      - conditions:
          - condition: trigger
            id: single
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ lights_on }}"
                sequence:
                  - action: light.turn_off
                    target:
                      area_id: !input target_area
            default:
              - action: light.turn_on
                target:
                  area_id: !input target_area
                data:
                  brightness_pct: "{{ mood_brightness | int }}"
                  color_temp_kelvin: "{{ mood_color_temp | int }}"
              # Meebewegen met de zon zolang de lampen nog op de door deze
              # automatisering gezette waarde staan: ochtend langzaam feller,
              # avond langzaam dimmer. Handmatig aangepast (app, dashboard,
              # andere automatisering) of alles uit = stoppen.
              - variables:
                  last_br: "{{ mood_brightness }}"
                  last_ct: "{{ mood_color_temp }}"
              # Wacht tot lampen status 'on' melden
              - delay:
                  seconds: 5
              - repeat:
                  while:
                    - condition: template
                      value_template: >
                        {% set ns = namespace(ok=true, n=0) %}
                        {% for e in area_entities(area_id)
                                    | select('match', 'light\.')
                                    | select('is_state', 'on') %}
                          {% set ns.n = ns.n + 1 %}
                          {% set b = (state_attr(e, 'brightness') | float(0)) / 2.55 %}
                          {% if (b - last_br | float) | abs > 3 %}
                            {% set ns.ok = false %}
                          {% endif %}
                          {% if 'color_temp' in (state_attr(e, 'supported_color_modes') or []) %}
                            {% set k = state_attr(e, 'color_temp_kelvin') %}
                            {% if k is none or (k | float - last_ct | float) | abs > 150 %}
                              {% set ns.ok = false %}
                            {% endif %}
                          {% endif %}
                        {% endfor %}
                        {{ ns.n > 0 and ns.ok }}
                  sequence:
                    - variables:
                        el: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
                        p: "{{ ([0, (el - dark_el) / (day_el - dark_el), 1] | sort)[1] }}"
                        step_br: "{{ (dark_br + (day_br - dark_br) * p) | round(0) | int }}"
                        step_ct: "{{ (dark_ct + (day_ct - dark_ct) * p) | round(0) | int }}"
                        # Alleen lampen die nog aan staan, uitgezette lampen blijven uit
                        on_lights: >
                          {{ area_entities(area_id)
                             | select('match', 'light\.')
                             | select('is_state', 'on')
                             | list }}
                    # Alleen bijsturen in het overgangsgebied (met marge zodat de
                    # eindwaarde nog gezet wordt), niet de hele dag/nacht
                    - if:
                        - condition: template
                          value_template: "{{ dark_el - 1 < el < day_el + 1 }}"
                      then:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ on_lights }}"
                          data:
                            brightness_pct: "{{ step_br }}"
                            color_temp_kelvin: "{{ step_ct }}"
                            # Iets korter dan de stap, zodat de lamp klaar is
                            # (en zijn status gemeld heeft) voor de volgende check
                            transition: "{{ step_s - 15 }}"
                        - variables:
                            last_br: "{{ step_br }}"
                            last_ct: "{{ step_ct }}"
                    - delay:
                        seconds: "{{ step_s }}"

      # ============================================
      # 2x DRUK — Focus (helder wit werklicht)
      # ============================================
      - conditions:
          - condition: trigger
            id: double
        sequence:
          - action: light.turn_on
            target:
              area_id: !input target_area
            data:
              brightness_pct: "{{ focus_br }}"
              color_temp_kelvin: "{{ focus_ct }}"

      # ============================================
      # 3x DRUK — Feestmodus (kleur-fade loop)
      # ============================================
      - conditions:
          - condition: trigger
            id: triple
        sequence:
          # Zet lampen aan op startkleur
          - action: light.turn_on
            target:
              area_id: !input target_area
            data:
              brightness_pct: "{{ party_br }}"
              rgb_color: [255, 0, 0]
              transition: 1
          - delay:
              seconds: 2
          # Oneindige loop — wordt gestopt door mode: restart
          # bij de volgende knopdruk
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                # Rood → Geel
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [255, 180, 0]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"
                # Geel → Groen
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [0, 255, 0]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"
                # Groen → Cyaan
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [0, 255, 200]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"
                # Cyaan → Blauw
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [0, 0, 255]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"
                # Blauw → Paars
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [150, 0, 255]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"
                # Paars → Roze
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [255, 0, 150]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"
                # Roze → Rood (loop opnieuw)
                - action: light.turn_on
                  target:
                    area_id: !input target_area
                  data:
                    rgb_color: [255, 0, 0]
                    transition: "{{ party_tr }}"
                - delay:
                    seconds: "{{ party_tr }}"

      # ============================================
      # LANG INDRUKKEN — Nachtlamp
      # ============================================
      - conditions:
          - condition: trigger
            id: long
        sequence:
          - action: light.turn_on
            target:
              area_id: !input target_area
            data:
              brightness_pct: "{{ night_br }}"
              color_temp_kelvin: "{{ night_ct }}"
